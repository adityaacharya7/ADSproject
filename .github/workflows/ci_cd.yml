name: Continuous Integration & Deployment (CI/CD) Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: "supportflow-ai"

jobs:
  # ----------------------------------------------------------------------------
  # STAGE 1: LINTING & STATIC CODE ANALYSIS
  # ----------------------------------------------------------------------------
  lint:
    name: 1. Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint Python Code with Flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

  # ----------------------------------------------------------------------------
  # STAGE 2: AUTOMATED TESTING (PYTEST)
  # ----------------------------------------------------------------------------
  test:
    name: 2. Operational Workflow Testing
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Operational Test Suite
        run: |
          python -m pytest test_operational.py -v --tb=short

  # ----------------------------------------------------------------------------
  # STAGE 3: MODEL & ASSET INTEGRITY VERIFICATION
  # ----------------------------------------------------------------------------
  model-check:
    name: 3. Model Integrity & Deserialization Check
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Model Weights and Deserialization Integrity
        run: |
          python -c "
          from model_engine import EmotionEngine
          engine = EmotionEngine()
          assert engine.pipeline is not None
          res = engine.predict('I am very satisfied with this quick response!')
          assert res['primary_emotion'] in ('Joy / Gratitude', 'Neutral / Inquiry', 'Anger / Frustration', 'Disappointment / Sadness', 'Fear / Anxiety')
          print(f'[+] Production model verified: predicted {res[\"primary_emotion\"]}')
          "

  # ----------------------------------------------------------------------------
  # STAGE 4: DOCKER CONTAINER BUILD & VERIFICATION
  # ----------------------------------------------------------------------------
  docker-build:
    name: 4. Docker Container Build Verification
    needs: [test, model-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:latest
